version: "3.9"

# docker-compose.prod.yml
# ใช้สำหรับ Production: ไม่ build เอง แต่ pull image สำเร็จรูปจาก Docker Hub มารัน
# ก่อนใช้งาน: แก้ <dockerhub-username> ให้เป็น Docker Hub username ของตัวเอง
# คำสั่งรัน: docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: staffcar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: <dockerhub-username>/staffcar-api:v1.0.0
    container_name: staffcar-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: <dockerhub-username>/staffcar-web:v1.0.0
    container_name: staffcar-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
